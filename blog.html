    <script>
        (function() {
            var postsContainer = document.getElementById('posts-container');
            var paginationContainer = document.getElementById('pagination');
            var posts = [];
            var postsPerPage = 5;
            var currentPage = 1;

            // Load posts from JSON file
            function loadPosts() {
                fetch('./assets/json/posts.json?t=' + new Date().getTime())
                    .then(function(response) {
                        return response.json();
                    })
                    .then(function(data) {
                        posts = data.posts || [];
                        postsPerPage = data.postsPerPage || 5;
                        renderPosts();
                        renderPagination();
                    })
                    .catch(function(error) {
                        console.error('Error loading posts:', error);
                        postsContainer.innerHTML = '<div class="no-posts">Failed to load posts</div>';
                    });
            }

            // Get posts for current page
            function getCurrentPagePosts() {
                var start = (currentPage - 1) * postsPerPage;
                var end = start + postsPerPage;
                return posts.slice(start, end);
            }

            // Get total pages
            function getTotalPages() {
                return Math.ceil(posts.length / postsPerPage);
            }

            // Render posts
            function renderPosts() {
                if (posts.length === 0) {
                    postsContainer.innerHTML = '<div class="no-posts">No posts yet. Check back soon!</div>';
                    return;
                }

                var pagePosts = getCurrentPagePosts();
                var html = '';
                
                pagePosts.forEach(function(post) {
                    html += '<div class="blog-post">';
                    html += '<div class="blog-post-date">' + post.dateDisplay + '</div>';
                    html += '<div class="blog-post-title">' + post.title + '</div>';
                    html += '<div class="blog-post-content">' + post.content + '</div>';
                    
                    if (post.tags && post.tags.length > 0) {
                        html += '<div class="blog-tags">';
                        post.tags.forEach(function(tag) {
                            html += '<span class="blog-tag">' + tag + '</span>';
                        });
                        html += '</div>';
                    }
                    
                    html += '</div>';
                });

                postsContainer.innerHTML = html;
            }

            // Render pagination
            function renderPagination() {
                if (posts.length === 0) {
                    paginationContainer.innerHTML = '';
                    return;
                }

                var totalPages = getTotalPages();
                var html = '';

                // Previous button
                html += '<button onclick="changePage(' + (currentPage - 1) + ')" ' + 
                    (currentPage === 1 ? 'disabled' : '') + '>← Prev</button>';

                // Page info
                html += '<span class="page-info">Page ' + currentPage + ' of ' + totalPages + '</span>';

                // Next button
                html += '<button onclick="changePage(' + (currentPage + 1) + ')" ' + 
                    (currentPage === totalPages ? 'disabled' : '') + '>Next →</button>';

                paginationContainer.innerHTML = html;
            }

            // Change page
            window.changePage = function(page) {
                var totalPages = getTotalPages();
                if (page < 1 || page > totalPages) {
                    return;
                }
                currentPage = page;
                renderPosts();
                renderPagination();
                
                // Scroll to top of posts
                postsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            };

            // Initialize
            loadPosts();
        })();
    </script>
